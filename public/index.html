<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NullForge</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Animated Cyber Grid Background -->
  <canvas id="grid"></canvas>

  <!-- NAVBAR -->
  <nav class="navbar">
    <ul>
      <li><a href="#hero">Home</a></li>
      <li><a href="#apps">Apps</a></li>
      <li><a href="#games">Games</a></li>
      <li><a href="#tools">Tools</a></li>
    </ul>
  </nav>

  <!-- HERO SECTION -->
  <section id="hero" class="hero">
    <div class="hero-content">
      <h1 class="logo">NullForge</h1>
      <p class="subtitle">Forging the Future</p>

      <!-- Search Bar Below Logo -->
      <div class="search-wrapper">
        <div class="search-container">
          <input 
            type="text" 
            id="searchInput" 
            class="search-input" 
            placeholder="Search the web or paste URL..."
          >
          <button id="searchBtn" class="search-btn">⌕</button>
          <div id="searchResults" class="search-results"></div>
        </div>
      </div>

      <div class="hero-buttons">
        <a class="hero-btn" href="#apps">Apps</a>
        <a class="hero-btn" href="#games">Games</a>
        <a class="hero-btn" href="#tools">Tools</a>
      </div>
    </div>
  </section>

  <!-- APPS SECTION -->
  <section id="apps" class="section">
    <h2 class="section-title">Apps</h2>
    <div class="card-grid">
      <div class="card">
        <img src="icons/app1.png" class="card-icon" alt="App One">
        <h3>App One</h3>
      </div>

      <div class="card">
        <img src="icons/app2.png" class="card-icon" alt="App Two">
        <h3>App Two</h3>
      </div>
    </div>
  </section>

  <!-- GAMES SECTION -->
  <section id="games" class="section">
    <h2 class="section-title">Games</h2>
    <div class="card-grid">
      <div class="card">
        <img src="icons/game1.png" class="card-icon" alt="Game One">
        <h3>Game One</h3>
      </div>

      <div class="card">
        <img src="icons/game2.png" class="card-icon" alt="Game Two">
        <h3>Game Two</h3>
      </div>
    </div>
  </section>

  <!-- TOOLS SECTION -->
  <section id="tools" class="section">
    <h2 class="section-title">Tools</h2>
    <div class="card-grid">
      <div class="card">
        <img src="icons/tool1.png" class="card-icon" alt="Tool One">
        <h3>Tool One</h3>
      </div>

      <div class="card">
        <img src="icons/tool2.png" class="card-icon" alt="Tool Two">
        <h3>Tool Two</h3>
      </div>
    </div>
  </section>

  <!-- BROWSER MODAL -->
  <div id="browserModal" class="browser-modal">
    <div class="browser-window">
      <div class="browser-header">
        <button id="closeModal" class="close-btn">✕</button>
        <input type="text" id="browserUrl" class="browser-url-bar" placeholder="Enter URL...">
        <button id="browserReload" class="reload-btn">↻</button>
      </div>
      <div id="browserContent" class="browser-content">
        <iframe id="browserFrame" class="browser-frame" sandbox="allow-same-origin allow-scripts allow-popups allow-forms"></iframe>
      </div>
      <div class="browser-loading" id="browserLoading">Loading...</div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
